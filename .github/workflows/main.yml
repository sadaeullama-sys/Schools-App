
name: Build New Iqra Academy APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Generate Android project
        run: |
          flutter create --project-name new_iqra_academy --org com.ilyasmobile --platforms=android .

      - name: Restore correct widget test
        run: |
          mkdir -p test
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:new_iqra_academy/main.dart';

          void main() {
            testWidgets('New Iqra app starts', (WidgetTester tester) async {
              await tester.pumpWidget(const SchoolManagementApp());
              expect(find.byType(SchoolManagementApp), findsOneWidget);
            });
          }
          EOF

      - name: Set Play Store application ID
        run: |
          sed -i 's/com.ilyasmobile.new_iqra_academy/com.ilyasmobile.newiqraacademy/g' android/app/build.gradle.kts || true
          sed -i 's/com.ilyasmobile.new_iqra_academy/com.ilyasmobile.newiqraacademy/g' android/app/build.gradle || true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Build Play Store AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: new-iqra-academy-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: new-iqra-academy-aab
          path: build/app/outputs/bundle/release/app-release.aab
