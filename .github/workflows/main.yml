name: New Iqra Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The generated Android application ID is:
      # com.ilyasmobile.newiqraacademy
      - name: Generate Android platform project
        run: flutter create --org com.ilyasmobile --project-name newiqraacademy --platforms=android --no-pub .

      - name: Verify Android application ID
        shell: bash
        run: |
          grep -R -E 'com\.ilyasmobile\.newiqraacademy' android/app

      - name: Get Flutter packages
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-pub

      - name: Build APK for device testing
        run: flutter build apk --release

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: new-iqra-android-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
