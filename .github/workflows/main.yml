name: Build New Iqra Academy APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Create Android platform files
        run: flutter create --project-name schools_app --platforms=android .

      - name: Pin Android Gradle Plugin and Gradle wrapper
        run: |
          sed -i 's/com.android.application.*version.*/com.android.application version "8.6.1" apply false/' android/settings.gradle
          sed -i 's/org.jetbrains.kotlin.android.*version.*/org.jetbrains.kotlin.android version "2.1.0" apply false/' android/settings.gradle
          sed -i 's/gradle-.*-all.zip/gradle-8.7-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          cat android/settings.gradle
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-iqra-academy-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
