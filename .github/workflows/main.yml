name: Build New Iqra Academy APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform files
        run: flutter create --project-name new_iqra_academy --org com.ilyasmobile --platforms=android .

      - name: Set Play Store application ID
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = .*/applicationId = "com.ilyasmobile.newiqraacademy"/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i "s/applicationId .*/applicationId 'com.ilyasmobile.newiqraacademy'/" android/app/build.gradle
          else
            echo "Android app Gradle file not found"
            exit 1
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze application source
        run: flutter analyze lib/main.dart --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Build Play Store AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: new-iqra-academy-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: new-iqra-academy-aab
          path: build/app/outputs/bundle/release/app-release.aab
