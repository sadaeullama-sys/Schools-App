name: Build New Iqra Academy APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
      - name: Generate Android project
        run: flutter create --project-name new_iqra_academy --org com.ilyasmobile --platforms=android .
      - name: Set Play Store application ID
        run: |
          sed -i 's/applicationId = "com.ilyasmobile.new_iqra_academy"/applicationId = "com.ilyasmobile.newiqraacademy"/' android/app/build.gradle.kts || true
          sed -i "s/applicationId 'com.ilyasmobile.new_iqra_academy'/applicationId 'com.ilyasmobile.newiqraacademy'/" android/app/build.gradle || true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze
      - name: Build release APK
        run: flutter build apk --release
      - name: Build Play Store AAB
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: new-iqra-academy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: new-iqra-academy-aab
          path: build/app/outputs/bundle/release/app-release.aab
