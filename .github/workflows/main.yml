name: Build New Iqra Academy APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --project-name schools_app --platforms=android .

      - name: Get dependencies
        run: flutter pub get

      # Gradle distribution servers occasionally return HTTP 502/504.
      # Retry the build instead of failing on the first temporary response.
      - name: Build APK (retry temporary Gradle download failures)
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "APK build attempt ${attempt}/3"
            flutter build apk --release
            result=$?
            if [ "$result" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; waiting 25 seconds before retry..."
              sleep 25
            fi
          done
          exit "$result"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: new-iqra-academy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
