name: Build New Iqra Academy APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --project-name new_iqra_academy --org com.ilyasmobile --platforms=android .

      - name: Set permanent Play Store application ID
        shell: bash
        run: |
          FILE=android/app/build.gradle.kts
          if [ -f "$FILE" ]; then
            sed -i 's/namespace = ".*"/namespace = "com.ilyasmobile.newiqraacademy"/' "$FILE"
            sed -i 's/applicationId = ".*"/applicationId = "com.ilyasmobile.newiqraacademy"/' "$FILE"
          else
            FILE=android/app/build.gradle
            sed -i "s/namespace .*/namespace 'com.ilyasmobile.newiqraacademy'/" "$FILE" || true
            sed -i "s/applicationId .*/applicationId 'com.ilyasmobile.newiqraacademy'/" "$FILE"
          fi
          grep -R "com.ilyasmobile.newiqraacademy" android/app

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run available tests
        run: flutter test

      - name: Build release APK (device testing)
        run: flutter build apk --release

      - name: Build release AAB (Play Console draft)
        run: flutter build appbundle --release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: new-iqra-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
